<div>
  <div class="content">
    <ng-template [ngTemplateOutlet]="getStepTemplate()" #render></ng-template>
  </div>
  <div>
      <button (click)="backStep()" *ngIf="stepIndex > 0">Back</button>
      <button (click)="nextStep()" *ngIf="!isLastStep()">Next</button>
      <button (click)="doSubmit()" *ngIf="isLastStep()">Submit</button>
  </div>
  <div class="progress"></div>
</div>
