<div>
    <a href="#" class="avartar">
        <img src="assets/avartar.png" alt="">
    </a>
    <div class="form-row">
        <mtc-form-dropdown [options]="genders" default="Gender" [formControl]="formStep.field('gender')"></mtc-form-dropdown>
    </div>
    <div class="form-row">
        <mtc-form-dropdown [options]="languages" default="Language" [formControl]="formStep.field('language')">
        </mtc-form-dropdown>
    </div>
    <div class="form-row">
        <app-form-datepicker name="birthdate" title="Date of Birth" [formControl]="formStep.field('birthdate')"></app-form-datepicker>
    </div>
    <div class="form-row">
        <app-form-input name="slogan" title="Slogan" [formControl]="formStep.field('slogan')"></app-form-input>
    </div>
    <div class="form-row form-group">
        <div class="form-holder">
            <app-form-input name="twitter" title="Twitter" [formControl]="formStep.field('twitter')" icon="twitter">
            </app-form-input>
        </div>
        <div class="form-holder">
            <app-form-input name="linkedin" title="Linkedin" [formControl]="formStep.field('linkedin')" icon="linkedin">
            </app-form-input>
        </div>
    </div>
    <div class="form-row form-group">
        <div class="form-holder">
            <app-form-input name="facebook" title="Facebook" [formControl]="formStep.field('facebook')" icon="facebook">
            </app-form-input>
        </div>
        <div class="form-holder">
            <app-form-input name="google" title="Google" [formControl]="formStep.field('google')" icon="google"></app-form-input>
        </div>
    </div>
</div>
