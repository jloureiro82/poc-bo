<div class="form-holder">
    <i class="zmdi zmdi-calendar"></i>
    <input 
        type="text" 
        class="form-control" 
        placeholder="{{title}}" 
        name="{{name}}" 
        [value]="value" 
        (change)="inputChange($event)" 
        (click)="showDatepicker()" 
        [matDatepicker]="myDatepicker"
        [formControl]="formControl"
    >
    <mat-datepicker #myDatepicker></mat-datepicker>
</div>
