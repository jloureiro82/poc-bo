
    <form class="login100-form validate-form" (submit)="doSubmit($event)" #form>
        <span class="login100-form-title">
            Member Login
        </span>

        <app-text-input name="email" placeholder="Email" symbol="envelope" validate="Valid email is required: ex@abc.xyz" [appFormField]="email"></app-text-input>
        <app-text-input type="password" name="password" placeholder="Password" symbol="lock" validate="Password is required" [appFormField]="password"></app-text-input>
        
        <app-submit-button></app-submit-button>

        <div class="text-center p-t-12">
            <span class="txt1">
                Forgot
            </span>
            <a class="txt2" href="#">
                Username / Password?
            </a>
        </div>

        <div class="text-center p-t-136">
            <a class="txt2" href="#">
                Create your Account
                <i class="fa fa-long-arrow-right m-l-5" aria-hidden="true"></i>
            </a>
        </div>
    </form>
