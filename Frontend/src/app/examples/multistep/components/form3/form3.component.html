<div class="row">
  <div class="col-md-12 col-md-offset-3">
    <button mat-raised-button (click)="isLinear = !isLinear" id="toggle-linear">
      {{!isLinear ? 'Enable linear mode' : 'Disable linear mode'}}
    </button>
    <mat-stepper [linear]="isLinear" #stepper>
      <mat-step [stepControl]="firstFormGroup" label="certificate">
        <form [formGroup]="firstFormGroup">
          <div *ngFor="let control of controlsStep1">
            <div *ngIf="control.type === 'radio'">
              <fieldset>
                <div *ngFor="let radio of control.options">
                  <input [type]="control.type" [name]="control.name" [formControlName]="radio.key" [value]="control.value" [checked]="radio.key === control.value" />
                  <label>{{radio.value}}</label>
                </div>
              </fieldset>
            </div>
          </div>
          <div>
            <button mat-button matStepperNext>Next</button>
          </div>
        </form>
      </mat-step>

      <mat-step [stepControl]="secondFormGroup" label="Fill out your address">
        <form [formGroup]="secondFormGroup">
          <div *ngFor="let control of controlsStep2">
            <label>{{control.label}}</label>
            <input [type]="control.type" [formControlName]="control.name" [value]="control.value" />
          </div>
          <div>
            <button mat-button matStepperPrevious>Back</button>
            <button mat-button matStepperNext>Next</button>
          </div>
        </form>
      </mat-step>
      <mat-step>
        <ng-template matStepLabel>Done</ng-template>
        <p>You are now done.</p>
        <div>
          <button mat-button matStepperPrevious>Back</button>
          <button mat-button (click)="stepper.reset()">Reset</button>
          <button mat-button (click)="submit()">submit</button>
        </div>
      </mat-step>
    </mat-stepper>
  </div>
</div>
