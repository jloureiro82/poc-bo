<div class="representative-main">
    <div class="representative-card" *ngFor="let representative of representatives">
        <div class="representative-block">
            <div class="representative-header">
                <div class="representative-text"><h5>Representante -</h5></div>
                <div class="representative-name">{{representative.name}}</div>
            </div>
            <div class="representative-content" *ngIf="representative.fileName">
                <div class="filename-item">{{representative.fileName}}</div>
                <div class="authenticate-item"><h5>{{authenticated(representative.isAuthenticated)}}</h5></div>
            </div>
            <div class="upload-file" *ngIf="!representative.fileName">
                <form>
                    <div class="form-group">
                      <input type="file" class="form-control-file" id="formControlFile1">
                    </div>
                </form>
            </div>
        </div>
        <div class="status-main">
            <app-status [status]="representative.status!"></app-status>
        </div>
    </div>
</div>
