<p>contact-form works!</p>
<div>
  <input *mtcStepField="'fieldA'" [formControl]="getField('fieldA')" type="text" name="fieldA" placeholder="Optional field A"><br>
  <input *mtcStepField="'fieldB'" [formControl]="getField('fieldB')" type="text" name="fieldB" placeholder="Optional field B"><br>
  <input *mtcStepField="'fieldC'" type="text" name="fieldC" placeholder="Optional field C"><br>
  <div>---------------</div>
  <input *mtcStepField="'reqFieldA'" type="text" name="reqFieldA" placeholder="Required field A"><br>
  <input *mtcStepField="'reqFieldB'" type="text" name="reqFieldB" placeholder="Required field B"><br>
  <input *mtcStepField="'reqFieldC'" type="text" name="reqFieldC" placeholder="Required field C"><br>
  <div>---------------</div>
  <div *mtcStepField="'optionField'">
    <button *mtcFieldOption="'optionA'">option A</button>
    <button *mtcFieldOption="'optionB'">option B</button>
    <button *mtcFieldOption="'optionC'">option C</button>
  </div>
  <div>---------------</div>
  <button (click)="toogleValidation()">TEST BUTTON</button>
  <div>---------------</div>
  <button (click)="toogleIncludeCard(false)">remoto</button> - <button (click)="toogleIncludeCard(true)">remoto + cartão</button><br>
  <input [formControl]="getField('cardField')" type="text" name="onlyCard" placeholder="only if card option enabled">
</div>
